name: Integracion Continua Java
 
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
 
 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verificar Java y Maven
        run: |
          java -version
          mvn -version

      # Forzamos limpieza y compilación desde cero
      - name: Ejecutar Maven Clean y Test
        run: mvn clean test
        


      
